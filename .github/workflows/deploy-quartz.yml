name: Deploy Forestry Wiki (Quartz)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GitHub Pages is enabled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$api")
          if [ "$code" = "200" ]; then
            echo "GitHub Pages is enabled"
            cat /tmp/pages.json
            exit 0
          fi
          echo "::error::GitHub Pages nie są włączone (HTTP ${code})."
          echo ""
          echo "Jednorazowo na swoim komputerze (wymaga gh CLI + uprawnień admina repo):"
          echo "  gh auth login"
          echo "  gh api --method POST repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow"
          echo ""
          echo "Następnie: Settings → Actions → Workflow permissions → Read and write"
          echo "Potem: Actions → Deploy Forestry Wiki → Re-run all jobs"
          cat /tmp/pages.json || true
          exit 1

      - name: Prepare Quartz content from vault
        working-directory: site
        run: |
          rm -rf content
          cp -a ../conifervision content
          echo "Markdown files: $(find content -name '*.md' | wc -l)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install and build
        working-directory: site
        run: |
          npm ci
          npx quartz build
          touch public/.nojekyll
          test -f public/index.html || (echo "::error::Brak index.html — sprawdź katalog conifervision/" && exit 1)
          echo "HTML pages: $(find public -name '*.html' | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
